<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 18</title>
</head>
<body>
    <div> Programação de Interfaces (aula 3)</div>
    <script type="text/javascript">
        // Inicializa variáveis com valor 10.
        var a = b = c = 10;

        // Verifica resto da divisao por 2
        document.write("<br><br>a%2 = " + a % 2);
        document.write("<br>(a + 1) % 2 = " + (a + 1) % 2);
        document.write("<br>(a + 2) % 2 = " + (a + 2) % 2);
        document.write("<br>(a + 3) % 2 = " + (a + 3) % 2);

        a = 5;
        // Pós-incremento: mostra e só depois soma 1
        document.write("<br><br>a++ = " + a++);
        document.write("<br>a = " + a);

        // Pré-incremento: soma 1 antes de mostrar
        document.write("<br><br>++b = " + ++b);
        document.write("<br>b = " + b);
    </script>
    
</body>
</html>
