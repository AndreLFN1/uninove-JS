<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 15</title>
</head>
<body>
    <div> Programação de Interfaces (aula 3)</div>
    <script type="text/javascript">
        // Define valores iniciais
        var a = 10, b = 20, c = 30;

        // Realiza operações matemáticas básicas
        var somar = a + b;
        var subtrair = a - b;
        var mult = a * b;
        var dividir = a/b;

        // Exibe os resultados na página
        document.write("<br>a = " + a + " | b = " + b + " c | = " + c + "<br>");
        document.write("<br>Somar (a+b) = " + somar);
        document.write("<br>Subtrair (a-b) = " + subtrair);
        document.write("<br>Multiplicar (a*b) = " + mult);
        document.write("<br>Dividir (a/b) = " + dividir)
        document.write("<br>(a/(a+c)) = " + a/(a+c) );
        document.write("<br>(b*a)/(a+c) = " + (b*a)/(a+c));
    </script>
    
</body>
</html>
