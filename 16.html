<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 15</title>
</head>
<body>
    <div> Programação de Interfaces (aula 3)</div>
    <script type="text/javascript">
        // Inicializa três variáveis com o mesmo valor
        var a = b = c = 10;

        // Exemplos de operadores de atribuição
        a += b;
        document.write("<br>a = a + b : " + a);

        b *= c;
        document.write("<br>b = b * c : " + b);

        a -= c;
        document.write("<br>a = a - c : " + a);

        a /= c;
        document.write("<br>a = a / c : " + a);

        b %= 2;
        document.write("<br>b = b % 2 : " + b);
    </script>
    
</body>
</html>
